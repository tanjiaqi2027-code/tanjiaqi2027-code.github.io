<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽毛球大作战 - 终极优化版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a2a3a;
            color: #fff;
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        h1 {
            margin: 15px 0 5px 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .controls-info {
            font-size: 14px;
            margin-bottom: 10px;
            color: #a8d0e6;
        }

        .controls-info span {
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 8px;
            border-radius: 4px;
            margin: 0 4px;
        }

        .highlight-key {
            color: #f1c40f;
            font-weight: bold;
        }

        .ui-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-group label {
            font-size: 14px;
            font-weight: bold;
            color: #f9ca24;
        }

        button {
            background-color: #2c3e50;
            color: white;
            border: 2px solid #34495e;
            padding: 8px 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #34495e;
            transform: translateY(-2px);
        }

        button.active {
            background-color: #eb4d4b;
            border-color: #ff7979;
            box-shadow: 0 0 10px rgba(235, 77, 75, 0.6);
        }

        .diff-btn.active.easy {
            background-color: #2ecc71;
            border-color: #27ae60;
            box-shadow: 0 0 10px #2ecc71;
        }

        .diff-btn.active.normal {
            background-color: #f39c12;
            border-color: #e67e22;
            box-shadow: 0 0 10px #f39c12;
        }

        .diff-btn.active.hard {
            background-color: #c0392b;
            border-color: #e74c3c;
            box-shadow: 0 0 10px #c0392b;
        }

        canvas {
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            border: 4px solid #fff;
        }
    </style>
</head>

<body>

    <h1>🏸 羽毛球大作战 <span style="font-size: 16px; color:#f1c40f;">终极优化版</span></h1>
    <div class="controls-info">
        <span>P1 (左侧红方): <b>A/D</b> 移动 | <b class="highlight-key">W 或 空格键</b> 跳跃</span>
        <span>P2 (右侧蓝方): <b>←/→</b> 移动 | <b>↑</b> 跳跃</span>
    </div>

    <div class="ui-panel">
        <div class="btn-group">
            <button id="btn-1p" class="active" onclick="setMode(1)">1P vs 人机</button>
            <button id="btn-2p" onclick="setMode(2)">1P vs 2P</button>
        </div>

        <div class="btn-group" id="difficulty-panel">
            <label>AI难度：</label>
            <button class="diff-btn active easy" onclick="setDifficulty('easy')">简单</button>
            <button class="diff-btn normal" onclick="setDifficulty('normal')">普通</button>
            <button class="diff-btn hard" onclick="setDifficulty('hard')">困难</button>
        </div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ---- 全局设置 ----
        const GROUND_Y = 440;
        let isTwoPlayer = false;
        let p1Score = 0;
        let p2Score = 0;
        let serveSide = 1;
        let aiLevel = 'easy';
        let screenShake = 0; // 屏幕震动参数

        // AI 难度参数配置
        const aiSettings = {
            easy: { speed: 4, jumpChance: 0.1, reactDelay: 30, errorRange: 40 },
            normal: { speed: 7, jumpChance: 0.5, reactDelay: 10, errorRange: 15 },
            hard: { speed: 9, jumpChance: 0.9, reactDelay: 0, errorRange: 0 }
        };

        // 按键监听
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            // 阻止空格和方向键滚动页面
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        // ---- 粒子特效引擎 ----
        let particles = [];
        function createParticles(x, y, color, isSmash = false) {
            let count = isSmash ? 25 : 10; // 扣杀粒子更多
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * (isSmash ? 15 : 8),
                    vy: (Math.random() - 0.5) * (isSmash ? 15 : 8),
                    life: 1.0,
                    color: color
                });
            }
        }
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
                else {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        // ---- 飘动的白云 ----
        const clouds = [
            { x: 100, y: 80, speed: 0.2, scale: 1 },
            { x: 500, y: 50, speed: 0.1, scale: 1.5 },
            { x: 300, y: 120, speed: 0.3, scale: 0.8 }
        ];
        function drawClouds() {
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            clouds.forEach(c => {
                c.x -= c.speed;
                if (c.x < -100) c.x = canvas.width + 100;
                ctx.beginPath();
                ctx.arc(c.x, c.y, 20 * c.scale, 0, Math.PI * 2);
                ctx.arc(c.x + 20 * c.scale, c.y - 10 * c.scale, 25 * c.scale, 0, Math.PI * 2);
                ctx.arc(c.x + 40 * c.scale, c.y, 20 * c.scale, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // ---- 绘制动态阴影 ----
        function drawShadow(x, size, alpha) {
            ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
            ctx.beginPath();
            ctx.ellipse(x, GROUND_Y, size, size * 0.2, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        // ---- 玩家类 ----
        class Player {
            constructor(x, color, isRightSide) {
                this.w = 40;
                this.h = 60;
                this.x = x;
                this.y = GROUND_Y - this.h;
                this.vx = 0;
                this.vy = 0;
                this.speed = 7.5;
                this.jumpPower = -12.5;
                this.color = color;
                this.isRightSide = isRightSide;

                this.swingTimer = 0;
                this.aiTick = 0;
            }

            // 新增 altJumpKey 支持多个跳跃键
            update(leftKey, rightKey, jumpKey, altJumpKey, isAI = false) {
                this.vx = 0;

                if (!isAI) {
                    if (keys[leftKey]) this.vx = -this.speed;
                    if (keys[rightKey]) this.vx = this.speed;
                } else {
                    this.runAI();
                }

                // 跳跃（支持主跳跃键或副跳跃键，如 W 或 空格）
                let isJumping = keys[jumpKey] || (altJumpKey && keys[altJumpKey]);
                if (!isAI && isJumping && this.y >= GROUND_Y - this.h) {
                    this.vy = this.jumpPower;
                }

                // 物理位移
                this.vy += 0.5;
                this.x += this.vx;
                this.y += this.vy;

                // 地面碰撞
                if (this.y > GROUND_Y - this.h) {
                    this.y = GROUND_Y - this.h;
                    this.vy = 0;
                }

                // 边界与球网碰撞限制
                if (!this.isRightSide) {
                    if (this.x < 0) this.x = 0;
                    if (this.x + this.w > 390) this.x = 390 - this.w;
                } else {
                    if (this.x < 410) this.x = 410;
                    if (this.x + this.w > canvas.width) this.x = canvas.width - this.w;
                }

                if (this.swingTimer > 0) this.swingTimer--;
            }

            runAI() {
                this.aiTick++;
                let settings = aiSettings[aiLevel];
                let targetX = 600;

                if (bird.x > 350 || bird.vx > 0) {
                    if (this.aiTick % settings.reactDelay === 0 || settings.reactDelay === 0) {
                        targetX = bird.x + (Math.random() * settings.errorRange * 2 - settings.errorRange);
                    } else {
                        targetX = this.lastTargetX || 600;
                    }
                }
                this.lastTargetX = targetX;

                if (this.x + this.w / 2 < targetX - 15) {
                    this.vx = settings.speed;
                } else if (this.x + this.w / 2 > targetX + 15) {
                    this.vx = -settings.speed;
                }

                if (bird.y < this.y - 20 && Math.abs(bird.x - (this.x + this.w / 2)) < 80 && this.y === GROUND_Y - this.h) {
                    if (bird.vy > 0 && Math.random() < settings.jumpChance) {
                        this.vy = this.jumpPower;
                    }
                }
            }

            draw() {
                // 绘制玩家阴影
                let shadowAlpha = 0.3 - ((GROUND_Y - this.h - this.y) / 200);
                if (shadowAlpha > 0) drawShadow(this.x + this.w / 2, 25, shadowAlpha);

                ctx.save();
                ctx.translate(this.x + this.w / 2, this.y + this.h / 2);

                // 绘制球拍
                ctx.save();
                let racketAngle = this.isRightSide ? -Math.PI / 6 : Math.PI / 6;
                if (this.swingTimer > 0) {
                    let swingImpact = (this.swingTimer / 15) * Math.PI;
                    racketAngle += this.isRightSide ? -swingImpact : swingImpact;
                }

                ctx.rotate(racketAngle);
                ctx.translate(0, -this.h / 2 - 10);

                ctx.lineWidth = 4;
                ctx.strokeStyle = '#333';
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -30); ctx.stroke();

                ctx.lineWidth = 3;
                ctx.strokeStyle = this.isRightSide ? '#2980b9' : '#c0392b';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.beginPath();
                ctx.ellipse(0, -45, 12, 18, 0, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();

                ctx.lineWidth = 0.5; ctx.strokeStyle = '#555';
                for (let i = -8; i <= 8; i += 4) {
                    ctx.beginPath(); ctx.moveTo(i, -60); ctx.lineTo(i, -30); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(-10, -45 + i); ctx.lineTo(10, -45 + i); ctx.stroke();
                }
                ctx.restore();

                // 画身体 
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.roundRect(-this.w / 2, -this.h / 2, this.w, this.h, 15);
                ctx.fill();

                // 眼睛
                ctx.fillStyle = 'white';
                const eyeOffsetX = this.isRightSide ? -8 : 8;
                ctx.beginPath(); ctx.arc(eyeOffsetX, -10, 6, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'black';
                const pupilOffsetX = this.isRightSide ? (bird.x < this.x ? -2 : 0) : (bird.x > this.x ? 2 : 0);
                ctx.beginPath(); ctx.arc(eyeOffsetX + pupilOffsetX, -10, 3, 0, Math.PI * 2); ctx.fill();

                // 头带
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.fillRect(-this.w / 2, -25, this.w, 8);

                ctx.restore();
            }
        }

        // ---- 羽毛球对象 ----
        const bird = {
            x: 200, y: 100,
            vx: 0, vy: 0,
            r: 8,
            gravity: 0.25,
            trail: [], // 残影轨迹

            update() {
                // 记录残影
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 8) this.trail.shift();

                this.vx *= 0.985;
                this.vy *= 0.992;

                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < this.r) { this.x = this.r; this.vx *= -0.5; }
                if (this.x > canvas.width - this.r) { this.x = canvas.width - this.r; this.vx *= -0.5; }

                if (this.x + this.r > 395 && this.x - this.r < 405 && this.y + this.r > 280) {
                    this.vx *= -0.5;
                    if (this.x < 400) this.x = 395 - this.r;
                    else this.x = 405 + this.r;
                }

                if (this.y > GROUND_Y - this.r) {
                    createParticles(this.x, GROUND_Y, '#bdc3c7');
                    if (this.x < 400) {
                        p2Score++; serveSide = 1;
                    } else {
                        p1Score++; serveSide = 2;
                    }
                    resetBird();
                }
            },

            draw() {
                // 绘制羽毛球地面的精准落点阴影
                let heightFactor = (GROUND_Y - this.y) / 10;
                let shadowSize = Math.max(5, 20 - heightFactor);
                let shadowAlpha = Math.max(0.1, 0.4 - heightFactor / 40);
                if (this.y < GROUND_Y) {
                    drawShadow(this.x, shadowSize, shadowAlpha);
                }

                // 绘制飞行残影
                if (this.trail.length > 1 && (Math.abs(this.vx) > 3 || Math.abs(this.vy) > 3)) {
                    ctx.beginPath();
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let i = 1; i < this.trail.length; i++) {
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                    }
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.lineWidth = 6;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.stroke();
                }

                ctx.save();
                ctx.translate(this.x, this.y);
                let angle = Math.atan2(this.vy, this.vx);
                ctx.rotate(angle);

                // 尾羽
                ctx.fillStyle = '#fff';
                ctx.strokeStyle = '#eee';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(-24, -14); ctx.lineTo(-20, 0); ctx.lineTo(-24, 14);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                ctx.strokeStyle = '#ccc';
                ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-22, -10); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-22, 10); ctx.stroke();

                // 软木球头
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2); ctx.fill();

                ctx.restore();
            }
        };

        const p1 = new Player(150, '#ff4757', false);
        const p2 = new Player(600, '#1e90ff', true);

        function resetBird() {
            bird.vx = 0; bird.vy = 0; bird.y = 100;
            bird.trail = [];
            if (serveSide === 1) {
                bird.x = 200; p1.x = 150; p2.x = 600;
            } else {
                bird.x = 600; p1.x = 150; p2.x = 600;
            }
        }

        // ---- 击球判定 ----
        function checkCollision(player) {
            let hitRadius = 65; // 判定范围非常宽松
            let pCenterX = player.x + player.w / 2;
            let pCenterY = player.y + player.h / 2;

            let dist = Math.hypot(bird.x - pCenterX, bird.y - pCenterY);

            if (dist < hitRadius && bird.y < player.y + player.h) {
                bird.y = player.y - 15;
                player.swingTimer = 15;

                let hitPoint = (bird.x - pCenterX) / hitRadius;

                bird.vy = -12.5;
                bird.vx = hitPoint * 12 + player.vx * 0.7;

                // 扣杀机制
                if (player.y < GROUND_Y - player.h - 10 && bird.y < player.y) {
                    bird.vy = -6;
                    bird.vx = (player.isRightSide ? -18 : 18) + player.vx; // 极速扣杀
                    createParticles(bird.x, bird.y, '#ff4757', true);
                    screenShake = 10; // 触发屏幕震动
                } else {
                    createParticles(bird.x, bird.y, '#fff');
                }
            }
        }

        // ---- UI 交互 ----
        function setMode(mode) {
            isTwoPlayer = (mode === 2);
            document.getElementById('btn-1p').classList.toggle('active', !isTwoPlayer);
            document.getElementById('btn-2p').classList.toggle('active', isTwoPlayer);

            document.getElementById('difficulty-panel').style.opacity = isTwoPlayer ? '0.3' : '1';
            document.getElementById('difficulty-panel').style.pointerEvents = isTwoPlayer ? 'none' : 'auto';

            p1Score = 0; p2Score = 0; serveSide = 1; resetBird();
        }

        function setDifficulty(level) {
            aiLevel = level;
            document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.diff-btn.${level}`).classList.add('active');
            p1Score = 0; p2Score = 0; serveSide = 1; resetBird();
        }

        // ---- 主循环 ----
        function gameLoop() {
            // 参数传参：A键向左，D键向右，W键跳跃，Space键备用跳跃
            p1.update('KeyA', 'KeyD', 'KeyW', 'Space', false);
            p2.update('ArrowLeft', 'ArrowRight', 'ArrowUp', null, !isTwoPlayer);
            bird.update();

            checkCollision(p1);
            checkCollision(p2);

            // ---- 渲染画面 ----
            ctx.save();

            // 屏幕震动逻辑
            if (screenShake > 0) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
                screenShake--;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawClouds();

            // 远景树林
            ctx.fillStyle = 'rgba(46, 204, 113, 0.4)';
            ctx.beginPath(); ctx.arc(100, GROUND_Y, 80, Math.PI, 0); ctx.fill();
            ctx.beginPath(); ctx.arc(700, GROUND_Y, 120, Math.PI, 0); ctx.fill();
            ctx.beginPath(); ctx.arc(400, GROUND_Y, 60, Math.PI, 0); ctx.fill();

            // 地面渐变
            let groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, canvas.height);
            groundGrad.addColorStop(0, '#2ecc71');
            groundGrad.addColorStop(1, '#27ae60');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

            ctx.fillStyle = '#fff';
            ctx.fillRect(0, GROUND_Y, canvas.width, 5);
            ctx.fillRect(50, GROUND_Y, 700, 2);

            // 球网
            ctx.fillStyle = '#34495e';
            ctx.fillRect(396, 280, 8, 160);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.fillRect(393, 280, 14, 80);
            ctx.strokeStyle = '#bdc3c7';
            ctx.lineWidth = 1;
            for (let i = 280; i <= 360; i += 8) {
                ctx.beginPath(); ctx.moveTo(393, i); ctx.lineTo(407, i); ctx.stroke();
            }

            // 大比分
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.font = 'bold 120px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(p1Score, 200, 180);
            ctx.fillText(p2Score, 600, 180);

            // 实体与特效
            p1.draw();
            p2.draw();
            bird.draw();
            updateParticles();

            ctx.restore(); // 恢复震动前的画布状态

            requestAnimationFrame(gameLoop);
        }

        // 初始化
        resetBird();
        gameLoop();
    </script>
</body>

</html>
