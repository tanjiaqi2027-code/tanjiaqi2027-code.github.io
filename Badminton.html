<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽毛球大作战 - 极客暗黑版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700;900&display=swap');

        :root {
            --bg-color: #0d1117;
            --glass-bg: rgba(22, 27, 34, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-color);
            color: #e6edf3;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .mono {
            font-family: 'Fira Code', monospace;
        }

        /* 玻璃拟物态 */
        .glass {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        /* 文字渐变特效 */
        .text-gradient {
            background: linear-gradient(135deg, #60a5fa 0%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 键帽样式 */
        kbd {
            font-family: 'Fira Code', monospace;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-width: 2px;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 0.75rem;
            color: #e6edf3;
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
        }

        kbd.highlight {
            border-color: rgba(59, 130, 246, 0.4);
            color: #60a5fa;
            box-shadow: 0 2px 0 rgba(59, 130, 246, 0.2);
        }

        /* 画布样式：取消原来的亮色，改为暗黑融入 */
        canvas {
            background: linear-gradient(to bottom, #0d1117 0%, #161b22 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7), 0 0 30px rgba(59, 130, 246, 0.1);
            border-radius: 16px;
            max-width: 100%;
            height: auto;
        }

        /* 自定义按钮过渡 */
        .game-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .game-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .game-btn:active:not(:disabled) {
            transform: translateY(1px);
        }
    </style>
</head>

<body class="p-4 relative">

    <!-- 背景氛围光晕 (Ambient Glow) -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600/10 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[120px]">
        </div>
    </div>

    <div class="w-full max-w-4xl mx-auto z-10 pt-4 md:pt-8 flex flex-col items-center">

        <!-- Header -->
        <header class="text-center mb-6">
            <h1 class="text-3xl md:text-4xl font-black tracking-tight mb-3 flex items-center justify-center gap-3">
                <i data-lucide="gamepad-2" class="w-8 h-8 text-blue-500"></i>
                <span>羽毛球大作战</span>
                <span
                    class="text-gradient mono text-sm bg-blue-500/10 px-2 py-1 rounded-md border border-blue-500/20">v2.0</span>
            </h1>
        </header>

        <!-- UI & 控制台面板 -->
        <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">

            <!-- 玩家控制说明 -->
            <div class="glass p-4 flex flex-col justify-center gap-3">
                <div class="flex items-center text-sm">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#fe4c61] shadow-[0_0_8px_#fe4c61] mr-3"></span>
                    <span class="text-gray-400 w-12 font-bold mono">P1</span>
                    <div class="flex gap-1.5 items-center ml-2">
                        <kbd>A</kbd><kbd>D</kbd> <span class="text-gray-500 text-xs ml-1 mr-3">移动</span>
                        <kbd class="highlight">W</kbd> <span class="text-gray-500 text-xs ml-1">跳跃/扣杀</span>
                    </div>
                </div>
                <div class="flex items-center text-sm">
                    <span class="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-[0_0_8px_#3b82f6] mr-3"></span>
                    <span class="text-gray-400 w-12 font-bold mono">P2</span>
                    <div class="flex gap-1.5 items-center ml-2">
                        <kbd>←</kbd><kbd>→</kbd> <span class="text-gray-500 text-xs ml-1 mr-3">移动</span>
                        <kbd class="highlight">↑</kbd> <span class="text-gray-500 text-xs ml-1">跳跃/扣杀</span>
                    </div>
                </div>
            </div>

            <!-- 模式与难度选择 -->
            <div class="glass p-4 flex flex-col justify-between gap-3">
                <div class="flex items-center gap-2">
                    <i data-lucide="users" class="w-4 h-4 text-gray-500"></i>
                    <div class="flex gap-2 flex-1 bg-black/20 p-1 rounded-lg border border-white/5">
                        <button id="btn-1p" onclick="setMode(1)"
                            class="game-btn flex-1 py-1.5 text-xs font-bold rounded-md text-blue-400 bg-blue-500/10 border border-blue-500/30 shadow-[0_0_15px_rgba(59,130,246,0.2)]">1P
                            vs AI</button>
                        <button id="btn-2p" onclick="setMode(2)"
                            class="game-btn flex-1 py-1.5 text-xs font-bold rounded-md text-gray-400 border border-transparent hover:bg-white/5">1P
                            vs 2P</button>
                    </div>
                </div>

                <div id="difficulty-panel" class="flex items-center gap-2 transition-opacity duration-300">
                    <i data-lucide="cpu" class="w-4 h-4 text-gray-500"></i>
                    <div class="flex gap-2 flex-1">
                        <button onclick="setDifficulty('easy')"
                            class="diff-btn easy game-btn flex-1 py-1.5 text-xs font-bold rounded-md border text-green-400 bg-green-500/10 border-green-500/30 shadow-[0_0_15px_rgba(34,197,94,0.2)]">Easy</button>
                        <button onclick="setDifficulty('normal')"
                            class="diff-btn normal game-btn flex-1 py-1.5 text-xs font-bold rounded-md border border-transparent text-gray-400 hover:bg-white/5">Normal</button>
                        <button onclick="setDifficulty('hard')"
                            class="diff-btn hard game-btn flex-1 py-1.5 text-xs font-bold rounded-md border border-transparent text-gray-400 hover:bg-white/5">Hard</button>
                    </div>
                </div>
            </div>

        </div>

        <!-- 游戏画布 -->
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <script>
        lucide.createIcons();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ---- 全局设置 ----
        const GROUND_Y = 440;
        let isTwoPlayer = false;
        let p1Score = 0;
        let p2Score = 0;
        let serveSide = 1;
        let aiLevel = 'easy';
        let screenShake = 0;

        // 主题色彩配置
        const COLORS = {
            p1: '#fe4c61', // Luogu Red
            p2: '#3b82f6', // Tailwind Blue
            neonNet: '#00f2fe',
            groundLine: '#3b82f6'
        };

        const aiSettings = {
            easy: { speed: 4.5, jumpChance: 0.1, reactDelay: 25, errorRange: 45 },
            normal: { speed: 7, jumpChance: 0.5, reactDelay: 10, errorRange: 15 },
            hard: { speed: 9.5, jumpChance: 0.9, reactDelay: 0, errorRange: 0 }
        };

        // 按键监听
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        // ---- 粒子特效引擎 ----
        let particles = [];
        function createParticles(x, y, color, isSmash = false) {
            let count = isSmash ? 30 : 12;
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * (isSmash ? 18 : 8),
                    vy: (Math.random() - 0.5) * (isSmash ? 18 : 8),
                    life: 1.0,
                    color: color,
                    size: Math.random() * 3 + 1
                });
            }
        }
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.04;
                if (p.life <= 0) particles.splice(i, 1);
                else {
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        // ---- 暗黑星空与流云 ----
        const clouds = [
            { x: 100, y: 80, speed: 0.1, scale: 1, alpha: 0.05 },
            { x: 500, y: 50, speed: 0.05, scale: 1.5, alpha: 0.03 },
            { x: 300, y: 150, speed: 0.15, scale: 0.8, alpha: 0.04 }
        ];
        function drawBackground() {
            // 背景直接由 CSS 渲染，这里画点缀物
            ctx.fillStyle = '#fff';
            clouds.forEach(c => {
                ctx.globalAlpha = c.alpha;
                c.x -= c.speed;
                if (c.x < -100) c.x = canvas.width + 100;
                ctx.beginPath();
                ctx.arc(c.x, c.y, 30 * c.scale, 0, Math.PI * 2);
                ctx.arc(c.x + 30 * c.scale, c.y - 15 * c.scale, 40 * c.scale, 0, Math.PI * 2);
                ctx.arc(c.x + 60 * c.scale, c.y, 30 * c.scale, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // 远景赛博网格 / 剪影山
            ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
            ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(150, GROUND_Y - 80); ctx.lineTo(300, GROUND_Y); ctx.fill();
            ctx.beginPath(); ctx.moveTo(250, GROUND_Y); ctx.lineTo(450, GROUND_Y - 120); ctx.lineTo(600, GROUND_Y); ctx.fill();
            ctx.beginPath(); ctx.moveTo(550, GROUND_Y); ctx.lineTo(700, GROUND_Y - 60); ctx.lineTo(800, GROUND_Y); ctx.fill();
        }

        // ---- 绘制动态阴影 ----
        function drawShadow(x, size, alpha) {
            ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
            ctx.beginPath();
            ctx.ellipse(x, GROUND_Y, size, size * 0.2, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        // ---- 玩家类 ----
        class Player {
            constructor(x, color, isRightSide) {
                this.w = 40;
                this.h = 60;
                this.x = x;
                this.y = GROUND_Y - this.h;
                this.vx = 0;
                this.vy = 0;
                this.speed = 7.5;
                this.jumpPower = -12.5;
                this.color = color;
                this.isRightSide = isRightSide;
                this.swingTimer = 0;
                this.aiTick = 0;
            }

            update(leftKey, rightKey, jumpKey, altJumpKey, isAI = false) {
                this.vx = 0;
                if (!isAI) {
                    if (keys[leftKey]) this.vx = -this.speed;
                    if (keys[rightKey]) this.vx = this.speed;
                } else {
                    this.runAI();
                }

                let isJumping = keys[jumpKey] || (altJumpKey && keys[altJumpKey]);
                if (!isAI && isJumping && this.y >= GROUND_Y - this.h) {
                    this.vy = this.jumpPower;
                }

                this.vy += 0.5;
                this.x += this.vx;
                this.y += this.vy;

                if (this.y > GROUND_Y - this.h) {
                    this.y = GROUND_Y - this.h;
                    this.vy = 0;
                }

                if (!this.isRightSide) {
                    if (this.x < 0) this.x = 0;
                    if (this.x + this.w > 390) this.x = 390 - this.w;
                } else {
                    if (this.x < 410) this.x = 410;
                    if (this.x + this.w > canvas.width) this.x = canvas.width - this.w;
                }

                if (this.swingTimer > 0) this.swingTimer--;
            }

            runAI() {
                this.aiTick++;
                let settings = aiSettings[aiLevel];
                let targetX = 600;

                if (bird.x > 350 || bird.vx > 0) {
                    if (this.aiTick % settings.reactDelay === 0 || settings.reactDelay === 0) {
                        targetX = bird.x + (Math.random() * settings.errorRange * 2 - settings.errorRange);
                    } else {
                        targetX = this.lastTargetX || 600;
                    }
                }
                this.lastTargetX = targetX;

                if (this.x + this.w / 2 < targetX - 15) this.vx = settings.speed;
                else if (this.x + this.w / 2 > targetX + 15) this.vx = -settings.speed;

                if (bird.y < this.y - 20 && Math.abs(bird.x - (this.x + this.w / 2)) < 80 && this.y === GROUND_Y - this.h) {
                    if (bird.vy > 0 && Math.random() < settings.jumpChance) this.vy = this.jumpPower;
                }
            }

            draw() {
                let shadowAlpha = 0.5 - ((GROUND_Y - this.h - this.y) / 200);
                if (shadowAlpha > 0) drawShadow(this.x + this.w / 2, 25, shadowAlpha);

                ctx.save();
                ctx.translate(this.x + this.w / 2, this.y + this.h / 2);

                // 发光特效
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;

                // 绘制球拍
                ctx.save();
                let racketAngle = this.isRightSide ? -Math.PI / 6 : Math.PI / 6;
                if (this.swingTimer > 0) {
                    let swingImpact = (this.swingTimer / 15) * Math.PI;
                    racketAngle += this.isRightSide ? -swingImpact : swingImpact;
                }

                ctx.rotate(racketAngle);
                ctx.translate(0, -this.h / 2 - 10);

                ctx.shadowBlur = 0; // 拍柄不发光
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#475569';
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -30); ctx.stroke();

                ctx.shadowBlur = 10; // 拍网发光
                ctx.shadowColor = this.color;
                ctx.lineWidth = 3;
                ctx.strokeStyle = this.color;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.beginPath();
                ctx.ellipse(0, -45, 12, 18, 0, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.lineWidth = 0.5; ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                for (let i = -8; i <= 8; i += 4) {
                    ctx.beginPath(); ctx.moveTo(i, -60); ctx.lineTo(i, -30); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(-10, -45 + i); ctx.lineTo(10, -45 + i); ctx.stroke();
                }
                ctx.restore();

                // 画身体 (赛博像素风)
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.roundRect(-this.w / 2, -this.h / 2, this.w, this.h, 8);
                ctx.fill();

                ctx.shadowBlur = 0;
                // 眼睛
                ctx.fillStyle = '#fff';
                const eyeOffsetX = this.isRightSide ? -8 : 8;
                ctx.beginPath(); ctx.arc(eyeOffsetX, -10, 6, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#0f172a';
                const pupilOffsetX = this.isRightSide ? (bird.x < this.x ? -2 : 0) : (bird.x > this.x ? 2 : 0);
                ctx.beginPath(); ctx.arc(eyeOffsetX + pupilOffsetX, -10, 3, 0, Math.PI * 2); ctx.fill();

                // 头带
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.fillRect(-this.w / 2, -25, this.w, 6);

                ctx.restore();
            }
        }

        // ---- 羽毛球对象 ----
        const bird = {
            x: 200, y: 100, vx: 0, vy: 0, r: 8, gravity: 0.25, trail: [],

            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 10) this.trail.shift();

                this.vx *= 0.985; this.vy *= 0.992;
                this.vy += this.gravity;
                this.x += this.vx; this.y += this.vy;

                if (this.x < this.r) { this.x = this.r; this.vx *= -0.5; }
                if (this.x > canvas.width - this.r) { this.x = canvas.width - this.r; this.vx *= -0.5; }

                if (this.x + this.r > 395 && this.x - this.r < 405 && this.y + this.r > 280) {
                    this.vx *= -0.5;
                    if (this.x < 400) this.x = 395 - this.r;
                    else this.x = 405 + this.r;
                }

                if (this.y > GROUND_Y - this.r) {
                    createParticles(this.x, GROUND_Y, '#38bdf8');
                    if (this.x < 400) { p2Score++; serveSide = 1; }
                    else { p1Score++; serveSide = 2; }
                    resetBird();
                }
            },

            draw() {
                let heightFactor = (GROUND_Y - this.y) / 10;
                let shadowSize = Math.max(5, 20 - heightFactor);
                let shadowAlpha = Math.max(0.1, 0.6 - heightFactor / 40);
                if (this.y < GROUND_Y) drawShadow(this.x, shadowSize, shadowAlpha);

                // 科幻残影
                if (this.trail.length > 1 && (Math.abs(this.vx) > 3 || Math.abs(this.vy) > 3)) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let i = 1; i < this.trail.length; i++) ctx.lineTo(this.trail[i].x, this.trail[i].y);
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#38bdf8';
                    ctx.lineWidth = 5;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.atan2(this.vy, this.vx));

                // 赛博羽毛
                ctx.fillStyle = '#f8fafc';
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(-24, -12); ctx.lineTo(-20, 0); ctx.lineTo(-24, 12);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                ctx.strokeStyle = '#cbd5e1';
                ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-22, -8); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-22, 8); ctx.stroke();

                // 荧光球头
                ctx.fillStyle = '#38bdf8';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#38bdf8';
                ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2); ctx.fill();

                ctx.restore();
            }
        };

        const p1 = new Player(150, COLORS.p1, false);
        const p2 = new Player(600, COLORS.p2, true);

        function resetBird() {
            bird.vx = 0; bird.vy = 0; bird.y = 100;
            bird.trail = [];
            if (serveSide === 1) { bird.x = 200; p1.x = 150; p2.x = 600; }
            else { bird.x = 600; p1.x = 150; p2.x = 600; }
        }

        // ---- 击球判定 ----
        function checkCollision(player) {
            let hitRadius = 65;
            let pCenterX = player.x + player.w / 2;
            let pCenterY = player.y + player.h / 2;
            let dist = Math.hypot(bird.x - pCenterX, bird.y - pCenterY);

            if (dist < hitRadius && bird.y < player.y + player.h) {
                bird.y = player.y - 15;
                player.swingTimer = 15;
                let hitPoint = (bird.x - pCenterX) / hitRadius;

                bird.vy = -12.5;
                bird.vx = hitPoint * 12 + player.vx * 0.7;

                if (player.y < GROUND_Y - player.h - 10 && bird.y < player.y) {
                    bird.vy = -6;
                    bird.vx = (player.isRightSide ? -19 : 19) + player.vx;
                    createParticles(bird.x, bird.y, player.color, true);
                    screenShake = 12;
                } else {
                    createParticles(bird.x, bird.y, '#38bdf8');
                }
            }
        }

        // ---- UI 交互 ----
        function setMode(mode) {
            isTwoPlayer = (mode === 2);

            const btn1p = document.getElementById('btn-1p');
            const btn2p = document.getElementById('btn-2p');

            // 重置状态
            btn1p.className = 'game-btn flex-1 py-1.5 text-xs font-bold rounded-md border border-transparent text-gray-400 hover:bg-white/5';
            btn2p.className = 'game-btn flex-1 py-1.5 text-xs font-bold rounded-md border border-transparent text-gray-400 hover:bg-white/5';

            if (!isTwoPlayer) {
                btn1p.className = 'game-btn flex-1 py-1.5 text-xs font-bold rounded-md text-blue-400 bg-blue-500/10 border border-blue-500/30 shadow-[0_0_15px_rgba(59,130,246,0.2)]';
            } else {
                btn2p.className = 'game-btn flex-1 py-1.5 text-xs font-bold rounded-md text-blue-400 bg-blue-500/10 border border-blue-500/30 shadow-[0_0_15px_rgba(59,130,246,0.2)]';
            }

            document.getElementById('difficulty-panel').style.opacity = isTwoPlayer ? '0.3' : '1';
            document.getElementById('difficulty-panel').style.pointerEvents = isTwoPlayer ? 'none' : 'auto';

            p1Score = 0; p2Score = 0; serveSide = 1; resetBird();
        }

        function setDifficulty(level) {
            aiLevel = level;

            // 清除所有高亮
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.className = `diff-btn ${btn.classList[1]} game-btn flex-1 py-1.5 text-xs font-bold rounded-md border border-transparent text-gray-400 hover:bg-white/5`;
            });

            const activeBtn = document.querySelector(`.diff-btn.${level}`);

            if (level === 'easy') {
                activeBtn.className = 'diff-btn easy game-btn flex-1 py-1.5 text-xs font-bold rounded-md text-green-400 bg-green-500/10 border border-green-500/30 shadow-[0_0_15px_rgba(34,197,94,0.2)]';
            } else if (level === 'normal') {
                activeBtn.className = 'diff-btn normal game-btn flex-1 py-1.5 text-xs font-bold rounded-md text-yellow-400 bg-yellow-500/10 border border-yellow-500/30 shadow-[0_0_15px_rgba(234,179,8,0.2)]';
            } else {
                activeBtn.className = 'diff-btn hard game-btn flex-1 py-1.5 text-xs font-bold rounded-md text-red-400 bg-red-500/10 border border-red-500/30 shadow-[0_0_15px_rgba(239,68,68,0.2)]';
            }

            p1Score = 0; p2Score = 0; serveSide = 1; resetBird();
        }

        // ---- 主循环 ----
        function gameLoop() {
            p1.update('KeyA', 'KeyD', 'KeyW', 'Space', false);
            p2.update('ArrowLeft', 'ArrowRight', 'ArrowUp', null, !isTwoPlayer);
            bird.update();

            checkCollision(p1);
            checkCollision(p2);

            ctx.save();
            if (screenShake > 0) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
                screenShake--;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            // 赛博地面
            let groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, canvas.height);
            groundGrad.addColorStop(0, '#0f172a');
            groundGrad.addColorStop(1, '#020617');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

            // 地面霓虹线
            ctx.shadowBlur = 10;
            ctx.shadowColor = COLORS.groundLine;
            ctx.fillStyle = COLORS.groundLine;
            ctx.fillRect(0, GROUND_Y, canvas.width, 2);
            ctx.fillRect(50, GROUND_Y, 700, 1);
            ctx.shadowBlur = 0;

            // 霓虹球网
            ctx.fillStyle = '#1e293b'; // 网柱
            ctx.fillRect(396, 280, 8, 160);

            ctx.shadowBlur = 8;
            ctx.shadowColor = COLORS.neonNet;
            ctx.fillStyle = 'rgba(0, 242, 254, 0.15)'; // 网底色
            ctx.fillRect(393, 280, 14, 80);
            ctx.strokeStyle = 'rgba(0, 242, 254, 0.8)';
            ctx.lineWidth = 1;
            for (let i = 280; i <= 360; i += 8) {
                ctx.beginPath(); ctx.moveTo(393, i); ctx.lineTo(407, i); ctx.stroke();
            }
            ctx.shadowBlur = 0;

            // 暗系比分
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.font = 'bold 140px Inter';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(p1Score, 200, 180);
            ctx.fillText(p2Score, 600, 180);

            // 实体与特效
            p1.draw();
            p2.draw();
            bird.draw();
            updateParticles();

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        // 初始化
        resetBird();
        gameLoop();
    </script>
</body>

</html>
