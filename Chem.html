<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Molecular Designer Pro - CQYC Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700;900&display=swap');

        :root {
            --glass-bg: rgba(13, 17, 23, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d1117;
            font-family: 'Inter', system-ui, sans-serif;
            color: #e6edf3;
            user-select: none;
            /* 防止频繁拖动时误选文字 */
        }

        .mono {
            font-family: 'Fira Code', monospace;
        }

        /* 玻璃态 HUD 效果 */
        .glass {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        /* 修复后的霓虹发光文字（完美兼容 sub 下标） */
        .neon-text {
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6), 0 0 20px rgba(0, 255, 204, 0.3);
            letter-spacing: 1px;
        }

        /* 修复化学式下标的渲染边界被截断的 Bug */
        #formula-val sub {
            font-size: 0.55em;
            margin-left: 2px;
            position: relative;
            bottom: -0.25em;
            /* 替代 vertical-align: sub 以防止破坏渲染框 */
            vertical-align: baseline;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.8);
        }

        /* 3D Canvas 置于底层 */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* 避免 UI 遮挡鼠标拖动三维空间 */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        /* 交互元素恢复指针事件 */
        .pointer-events-auto {
            pointer-events: auto;
        }
    </style>
</head>

<body>

    <!-- 底层氛围光晕 -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-[#00ffcc]/10 rounded-full blur-[120px]">
        </div>
        <div class="absolute bottom-[-10%] right-[10%] w-[600px] h-[600px] bg-blue-600/10 rounded-full blur-[150px]">
        </div>
    </div>

    <!-- 顶层全息 UI 面板 -->
    <div class="ui-layer">

        <!-- 顶部信息栏 -->
        <div id="top-panel"
            class="absolute top-6 left-6 right-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="glass px-6 py-4 flex items-center shadow-lg border-l-4 border-l-[#00ffcc] pointer-events-auto">
                <div class="p-2 bg-[#00ffcc]/10 rounded-lg mr-4 border border-[#00ffcc]/20">
                    <i data-lucide="flask-conical" class="w-6 h-6 text-[#00ffcc]"></i>
                </div>
                <div id="formula-display" class="text-xl md:text-2xl font-black tracking-tight mono text-white">
                    Formula: <span id="formula-val" class="neon-text">Empty</span>
                </div>
            </div>

            <div class="glass px-6 py-3 flex space-x-6 text-sm font-semibold mono shadow-lg pointer-events-auto">
                <div class="flex flex-col">
                    <span class="text-gray-500 text-[10px] tracking-wider mb-0.5">ENERGY</span>
                    <div class="flex items-baseline text-blue-400">
                        <span id="energy-val" class="text-lg mr-1 font-bold">0.000</span> eV
                    </div>
                </div>
                <div class="w-px bg-white/10"></div>
                <div class="flex flex-col">
                    <span class="text-gray-500 text-[10px] tracking-wider mb-0.5">SELECT</span>
                    <div class="flex items-baseline text-[#00ffcc]">
                        <span id="select-count" class="text-lg mr-1 font-bold">0</span>/2
                    </div>
                </div>
            </div>
        </div>

        <!-- 左侧状态栏 -->
        <div id="ui-left"
            class="absolute top-36 left-6 glass px-5 py-4 border-l-4 border-l-[#ffcc00] shadow-lg min-w-[200px] pointer-events-auto">
            <div
                class="text-[#ffcc00] text-xs font-bold tracking-widest uppercase mb-3 flex items-center drop-shadow-[0_0_8px_rgba(255,204,0,0.5)]">
                <i data-lucide="activity" class="w-4 h-4 mr-2"></i> [ 实验室状态 ]
            </div>
            <div id="bond-log"
                class="text-gray-300 text-sm font-medium mono bg-black/30 px-3 py-2 rounded-lg border border-white/5 shadow-inner">
                等待操作...</div>
        </div>

        <!-- 隐藏彩蛋容器 (TriggerZax) -->
        <div id="zax-msg"
            class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-1000 text-pink-500/10">
            <i data-lucide="heart" class="w-96 h-96"></i>
        </div>

        <!-- 右下角控制按钮组 -->
        <div class="absolute bottom-28 right-6 flex flex-col gap-3 pointer-events-auto">
            <button onclick="deleteSelected()"
                class="glass px-5 py-3 border border-[#ff3366]/40 text-[#ff3366] hover:bg-[#ff3366]/20 hover:border-[#ff3366]/80 hover:text-white transition-all duration-300 font-semibold shadow-lg group flex items-center justify-start min-w-[190px]">
                <i data-lucide="trash-2" class="w-4 h-4 mr-3 group-hover:scale-110 transition-transform"></i> <span
                    class="text-sm tracking-wide">[ 删除选中原子 ]</span>
            </button>
            <button onclick="autoLayout()"
                class="glass px-5 py-3 border border-blue-500/40 text-blue-400 hover:bg-blue-500/20 hover:border-blue-500/80 hover:text-white transition-all duration-300 font-semibold shadow-lg group flex items-center justify-start min-w-[190px]">
                <i data-lucide="network" class="w-4 h-4 mr-3 group-hover:scale-110 transition-transform"></i> <span
                    class="text-sm tracking-wide">[ 自动拓扑排序 ]</span>
            </button>
            <button onclick="clearAll()"
                class="glass px-5 py-3 border border-gray-500/40 text-gray-400 hover:bg-gray-500/20 hover:border-gray-500/80 hover:text-white transition-all duration-300 font-semibold shadow-lg group flex items-center justify-start min-w-[190px]">
                <i data-lucide="eraser" class="w-4 h-4 mr-3 group-hover:scale-110 transition-transform"></i> <span
                    class="text-sm tracking-wide">[ 全部清空 ]</span>
            </button>
        </div>

        <!-- 底部中央控制台输入 -->
        <div id="cli-container"
            class="absolute bottom-6 left-1/2 -translate-x-1/2 w-full max-w-2xl px-4 pointer-events-auto flex flex-col">
            <div
                class="glass flex items-center px-5 py-3 shadow-2xl border border-[#00ffcc]/30 focus-within:border-[#00ffcc] focus-within:shadow-[0_0_20px_rgba(0,255,204,0.2)] transition-all bg-[#0d1117]/80 rounded-xl relative overflow-hidden group">
                <div
                    class="absolute left-0 top-0 bottom-0 w-1 bg-[#00ffcc]/30 group-focus-within:bg-[#00ffcc] transition-colors">
                </div>
                <i data-lucide="terminal-square"
                    class="text-[#00ffcc] w-5 h-5 mr-3 group-focus-within:animate-pulse"></i>
                <label class="text-[#00ffcc] font-bold text-sm mr-3 mono tracking-wider">COMMAND></label>
                <input type="text" id="cmd-input" placeholder="add C 5 / clear" autocomplete="off"
                    class="flex-1 bg-transparent border-none outline-none text-white font-medium mono placeholder-gray-600/80 text-sm md:text-base">
            </div>
            <div id="instruction"
                class="text-center mt-3 text-[11px] md:text-xs text-gray-500 font-medium tracking-wide flex justify-center items-center space-x-2 opacity-70">
                <i data-lucide="info" class="w-3.5 h-3.5"></i>
                <span>左键点击原子选择 | 连续点击两原子成/断键 | Delete键删除 | 拖动旋转</span>
            </div>
        </div>

    </div>

    <!-- 模块导入配置 -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <!-- 原有物理引擎逻辑核心区 -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const ATOM_DATA = {
            'C': { color: 0x333333, radius: 0.7, mass: 12 },
            'H': { color: 0xffffff, radius: 0.4, mass: 1 },
            'O': { color: 0xff3366, radius: 0.6, mass: 16 }
        };

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        camera.position.z = 20;

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const light = new THREE.PointLight(0xffffff, 100);
        light.position.set(10, 10, 10);
        scene.add(light);

        // --- 数据存储 ---
        let atoms = []; // 存储原子对象
        let manualBonds = new Set(); // 存储 "ID1-ID2"
        let selection = []; // 存储选中的原子 ID
        let idCounter = 0;

        const bondGroup = new THREE.Group();
        scene.add(bondGroup);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // --- 核心交互逻辑 ---
        window.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return; // 仅左键点击

            // 如果点击在 UI 层上，不触发三维相交检测
            if (e.target.closest('.pointer-events-auto')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(atoms.map(a => a.mesh));

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                const atom = atoms.find(a => a.mesh === clickedMesh);
                if (atom) handleSelection(atom.id);
            }
        });

        window.addEventListener('keydown', (e) => {
            // 防止在输入命令时误删
            if (document.activeElement === document.getElementById('cmd-input')) return;

            if (e.key === 'Delete' || e.key === 'Backspace') {
                deleteSelected();
            }
        });

        function handleSelection(id) {
            const atom = atoms.find(a => a.id === id);
            const sIdx = selection.indexOf(id);

            if (sIdx > -1) {
                // 取消选中
                selection.splice(sIdx, 1);
                atom.mesh.material.emissive.setHex(0x000000);
            } else {
                if (selection.length >= 2) {
                    // 清掉最早的一个
                    const first = atoms.find(a => a.id === selection[0]);
                    if (first) first.mesh.material.emissive.setHex(0x000000);
                    selection.shift();
                }
                selection.push(id);
                atom.mesh.material.emissive.setHex(0x00ffcc);
                atom.mesh.material.emissiveIntensity = 0.5;
            }

            // 连/断键逻辑
            if (selection.length === 2) {
                const [id1, id2] = selection.sort((a, b) => a - b);
                const bondKey = `${id1}-${id2}`;

                if (manualBonds.has(bondKey)) {
                    manualBonds.delete(bondKey);
                    document.getElementById('bond-log').innerText = "断开共价键";
                } else {
                    manualBonds.add(bondKey);
                    document.getElementById('bond-log').innerText = "建立新共价键";
                }

                // 自动清除高亮
                setTimeout(() => {
                    selection.forEach(sid => {
                        const a = atoms.find(at => at.id === sid);
                        if (a) a.mesh.material.emissive.setHex(0x000000);
                    });
                    selection = [];
                    document.getElementById('select-count').innerText = 0;
                }, 300);
            }
            document.getElementById('select-count').innerText = selection.length;
        }

        window.deleteSelected = function () {
            if (selection.length === 0) return;

            selection.forEach(sid => {
                const idx = atoms.findIndex(a => a.id === sid);
                if (idx > -1) {
                    scene.remove(atoms[idx].mesh);
                    // 清理相关的键
                    manualBonds.forEach(key => {
                        if (key.includes(sid.toString())) manualBonds.delete(key);
                    });
                    atoms.splice(idx, 1);
                }
            });
            selection = [];
            updateFormula();
            document.getElementById('select-count').innerText = 0;
            document.getElementById('bond-log').innerText = "原子已移除";
        };

        function renderBonds() {
            bondGroup.clear();
            const mat = new THREE.MeshPhongMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.5 });
            manualBonds.forEach(key => {
                const [id1, id2] = key.split('-').map(Number);
                const a1 = atoms.find(a => a.id === id1);
                const a2 = atoms.find(a => a.id === id2);
                if (a1 && a2) {
                    const dist = a1.mesh.position.distanceTo(a2.mesh.position);
                    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, dist, 8), mat);
                    cyl.position.copy(a1.mesh.position).lerp(a2.mesh.position, 0.5);
                    cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), a2.mesh.position.clone().sub(a1.mesh.position).normalize());
                    bondGroup.add(cyl);
                }
            });
        }

        // --- 基础功能 ---
        window.addAtom = function (type, pos = null, isStatic = false) {
            const data = ATOM_DATA[type];
            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(data.radius, 32, 32),
                new THREE.MeshPhongMaterial({
                    color: data.color,
                    shininess: 120,
                    emissive: data.color,
                    emissiveIntensity: 0.3
                })
            );

            if (pos) mesh.position.copy(pos);
            else mesh.position.set((Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15);

            const atomObj = {
                id: idCounter++,
                type,
                mesh,
                radius: data.radius,
                mass: data.mass,
                vel: new THREE.Vector3(0, 0, 0),
                targetPos: null,
                isStatic: isStatic // 新增：是否受物理引擎影响
            };

            scene.add(mesh);
            atoms.push(atomObj);
            updateFormula();
            return atomObj;
        };

        window.autoLayout = function () {
            if (atoms.length === 0) return;

            // 1. 初始化一个松散的随机三维分布
            atoms.forEach(a => {
                a.mesh.position.add(new THREE.Vector3(
                    (Math.random() - 0.5) * 5,
                    (Math.random() - 0.5) * 5,
                    (Math.random() - 0.5) * 5
                ));
            });

            document.getElementById('bond-log').innerText = "执行拓扑自适应优化...";

            // 给系统一个初始动能冲量
            atoms.forEach(a => {
                a.vel.add(new THREE.Vector3(
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2
                ));
            });
        };

        // --- 更新物理循环中的力学模型 ---
        function updatePhysics() {
            let totalPotential = 0;
            const k = 2.5; // 理想键长
            const repelStr = 1.2; // 斥力强度

            for (let i = 0; i < atoms.length; i++) {
                const a = atoms[i];

                if (a.isStatic) {
                    a.vel.set(0, 0, 0); // 强制速度清零
                    continue;
                }

                for (let j = 0; j < atoms.length; j++) {
                    if (i === j) continue;
                    const b = atoms[j];

                    const diff = new THREE.Vector3().subVectors(b.mesh.position, a.mesh.position);
                    const dist = diff.length() || 0.1;
                    const bondKey = `${Math.min(a.id, b.id)}-${Math.max(a.id, b.id)}`;

                    if (manualBonds.has(bondKey)) {
                        const forceMag = (dist - k) * 0.15;
                        const fVec = diff.clone().normalize().multiplyScalar(forceMag);
                        a.vel.add(fVec);
                        totalPotential += 0.5 * 0.15 * Math.pow(dist - k, 2);
                    } else {
                        const forceMag = repelStr / (dist * dist);
                        const fVec = diff.clone().normalize().multiplyScalar(forceMag);
                        a.vel.sub(fVec);
                        totalPotential += repelStr / dist;
                    }
                }

                // 中心约束力
                a.vel.add(a.mesh.position.clone().multiplyScalar(-0.01));

                // 应用位移
                a.mesh.position.add(a.vel);

                // 动态阻尼
                a.vel.multiplyScalar(0.85);
            }

            const energyVal = document.getElementById('energy-val');
            if (energyVal) energyVal.innerText = totalPotential.toFixed(3);
            renderBonds();
        }

        window.clearAll = function () {
            atoms.forEach(a => scene.remove(a.mesh));
            atoms = [];
            manualBonds.clear();
            selection = [];
            updateFormula();
        };

        function updateFormula() {
            const c = { 'C': 0, 'H': 0, 'O': 0 };
            atoms.forEach(a => c[a.type]++);
            let s = "";
            ['C', 'H', 'O'].forEach(el => { if (c[el] > 0) s += `${el}${c[el] > 1 ? `<sub>${c[el]}</sub>` : ""}`; });
            document.getElementById('formula-val').innerHTML = s || "Empty";
        }

        // --- 指令解析 ---
        document.getElementById('cmd-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = e.target.value.trim().toLowerCase();
                if (cmd === 'clear') clearAll();
                else if (cmd.startsWith('add ')) {
                    const parts = cmd.split(' ');
                    const type = parts[1].toUpperCase();
                    const num = parseInt(parts[2]) || 1;
                    if (ATOM_DATA[type]) for (let i = 0; i < num; i++) addAtom(type);
                }
                e.target.value = '';
            }
        });



        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 渲染 Lucide 图标
        lucide.createIcons();

    </script>
</body>

</html>
