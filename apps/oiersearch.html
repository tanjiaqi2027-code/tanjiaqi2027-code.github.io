<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <title>OIerDB 脚本生成器</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700;900&display=swap');

        :root {
            --bg-color: #0d1117;
            --glass-bg: rgba(22, 27, 34, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-color);
            color: #e6edf3;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .mono {
            font-family: 'Fira Code', monospace;
        }

        /* 玻璃拟物态 */
        .glass {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        /* 文字渐变特效 */
        .text-gradient {
            background: linear-gradient(135deg, #60a5fa 0%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 搜索列表为空时隐藏 */
        #search-result:empty {
            display: none;
            border: none;
        }

        /* Toast 动画 */
        @keyframes slideIn {
            from {
                transform: translateX(100%) scale(0.95);
                opacity: 0;
            }

            to {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }

            to {
                transform: translateX(10%);
                opacity: 0;
            }
        }

        .toast-enter {
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .toast-leave {
            animation: fadeOut 0.3s ease-in forwards;
        }
    </style>
    <script>
        const contests = [
            "NOI2004", "NOI2005", "NOI2006", "NOI2007", "NOI2008", "NOIP2008 提高", "NOI2009", "NOIP2009 提高", "CTSC2010", "APIO2010", "NOI2010", "NOI2010 D 类", "IOI2010", "NOIP2010 提高", "CTSC2011", "APIO2011", "NOI2011", "NOI2011 D 类", "IOI2011", "NOIP2011 提高", "CTSC2012", "APIO2012", "NOI2012", "NOI2012 D 类", "IOI2012", "NOIP2012 提高", "CTSC2013", "APIO2013", "NOI2013", "NOI2013 D 类", "IOI2013", "NOIP2013 提高", "NOIP2013 普及", "CTSC2014", "APIO2014", "NOI2014", "NOI2014 D 类", "IOI2014", "NOIP2014 提高", "NOIP2014 普及", "WC2015", "CTSC2015", "APIO2015", "NOI2015", "NOI2015 D 类", "IOI2015", "NOIP2015 提高", "NOIP2015 普及", "WC2016", "CTSC2016", "APIO2016", "NOI2016", "NOI2016 D 类", "IOI2016", "NOIP2016 提高", "NOIP2016 普及", "WC2017", "CTSC2017", "APIO2017", "NOI2017", "NOI2017 D 类", "IOI2017", "NOIP2017 提高", "NOIP2017 普及", "WC2018", "CTSC2018", "APIO2018", "NOI2018", "NOI2018 D 类", "IOI2018", "NOIP2018 提高", "NOIP2018 普及", "WC2019", "CTS2019", "APIO2019", "NOI2019", "NOI2019 夏令营", "IOI2019", "CSP2019 提高", "CSP2019 入门", "WC2020", "APIO2020", "NOI2020", "NOI2020 夏令营", "IOI2020", "CSP2020 提高", "CSP2020 入门", "NOIP2020", "WC2021", "APIO2021", "IOI2021", "NOI2021", "NOI2021 夏令营", "CSP2021 提高", "CSP2021 入门", "NOIP2021", "WC2022", "NGOI2022", "APIO2022", "APIO2022 线上", "IOI2022", "NOI2022", "NOI2022 夏令营", "CSP2022 提高", "CSP2022 入门", "NOIP2022", "WC2023", "春季测试 2023", "NGOI2023", "APIO2023", "APIO2023 线上", "NOI2023", "NOI2023 夏令营", "IOI2023", "CSP2023 提高", "CSP2023 入门", "NOIP2023", "NGOI2024", "WC2024", "APIO2024", "NOI2024", "NOI2024 夏令营", "IOI2024", "CSP2024 提高", "CSP2024 入门", "NOIP2024", "NGOI2025", "WC2025", "APIO2025", "NOI2025", "NOI2025 夏令营", "IOI2025", "CSP2025 提高", "CSP2025 入门", "NOIP2025", "NGOI2026", "WC2026"
        ];

        function levenshtein(s1, s2) {
            const matrix = [];
            for (let i = 0; i <= s1.length; i++) matrix[i] = [i];
            for (let j = 1; j <= s2.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= s1.length; i++) {
                for (let j = 1; j <= s2.length; j++) {
                    if (s1.charAt(i - 1) === s2.charAt(j - 1))
                        matrix[i][j] = matrix[i - 1][j - 1];
                    else
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 2,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j] + 1
                        );
                }
            }
            return matrix[s1.length][s2.length];
        }
    </script>
</head>

<body class="relative p-4 md:p-10">
    <!-- 背景氛围光晕 -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[10%] w-[600px] h-[600px] bg-emerald-600/10 rounded-full blur-[150px]">
        </div>
    </div>

    <div class="max-w-4xl mx-auto glass p-6 md:p-10 relative z-10">

        <!-- 标题 -->
        <h1 class="text-2xl md:text-3xl font-black mb-8 text-center tracking-tight border-b border-gray-700/50 pb-6">
            <span class="text-gradient">🔍 OIerDB 自定义搜索脚本生成器</span>
        </h1>

        <!-- 提示框 -->
        <div
            class="glass border-blue-500/20 bg-blue-500/10 p-4 mb-8 text-sm text-blue-200 flex items-center rounded-xl shadow-inner">
            💡 提示：添加比赛后，点击“不限”可设置具体分值或奖项要求。
        </div>

        <!-- 比赛列表表格区 -->
        <div class="overflow-x-auto bg-black/20 rounded-xl border border-white/5 mb-8">
            <table id="contest-list" class="w-full text-left border-collapse whitespace-nowrap">
                <!-- 表格内容由 JS 动态渲染 -->
            </table>
        </div>

        <!-- 搜索区 -->
        <div class="glass bg-white/5 p-6 rounded-xl mb-8 border border-white/5">
            <input type="text" id="contest-input" onkeyup="searchContest()" placeholder="输入比赛名称关键词 (例如: NOIP 2023)"
                class="w-full bg-[#0d1117]/80 border border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-lg px-4 py-3 text-white outline-none transition-all placeholder-gray-600 text-sm md:text-base font-medium shadow-inner" />
            <ul id="search-result"
                class="mt-3 max-h-[250px] overflow-y-auto bg-[#0d1117]/90 border border-gray-700/50 rounded-lg divide-y divide-gray-800/50">
            </ul>
        </div>

        <!-- 主操作按钮 -->
        <button
            class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold rounded-xl shadow-lg hover:shadow-teal-500/25 transition-all transform hover:-translate-y-0.5 mb-6 text-lg"
            onclick="generate()">
            ⚡ 生成自定义脚本
        </button>

        <!-- 附加操作按钮 -->
        <div class="flex flex-col sm:flex-row gap-4 mb-8">
            <button onclick="copyCode()"
                class="flex-1 py-3 bg-white/5 border border-purple-500/30 hover:border-purple-500/60 hover:bg-purple-500/10 text-purple-300 font-semibold rounded-xl transition-all flex justify-center items-center">
                📋 复制代码
            </button>
            <button onclick="openOierDB()"
                class="flex-1 py-3 bg-white/5 border border-blue-500/30 hover:border-blue-500/60 hover:bg-blue-500/10 text-blue-300 font-semibold rounded-xl transition-all flex justify-center items-center">
                🌐 前往 OIerDB
            </button>
        </div>

        <!-- 终端风格代码预览区 -->
        <div class="glass flex flex-col rounded-xl overflow-hidden border border-white/10 shadow-2xl">
            <!-- Mac 窗口头部 -->
            <div class="flex items-center px-4 py-3 border-b border-white/5 bg-white/5">
                <div class="flex space-x-2">
                    <div class="w-3 h-3 rounded-full bg-red-500/80 shadow-[0_0_10px_rgba(239,68,68,0.5)]"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500/80 shadow-[0_0_10px_rgba(234,179,8,0.5)]"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500/80 shadow-[0_0_10px_rgba(34,197,94,0.5)]"></div>
                </div>
                <div class="ml-4 text-xs text-gray-500 font-medium mono">custom_script.js</div>
            </div>
            <!-- 代码内容 -->
            <pre id="code"
                class="p-6 text-sm mono text-blue-300/90 overflow-x-auto whitespace-pre-wrap leading-relaxed bg-[#0d1117]/80 min-h-[100px]">// 生成的脚本将显示在这里...</pre>
        </div>

    </div>

    <!-- 浮动通知容器 -->
    <div id="error-list" class="fixed top-6 right-6 z-50 flex flex-col items-end space-y-3 pointer-events-none"></div>

    <script>
        function removeError(div) {
            div.classList.replace("toast-enter", "toast-leave");
            setTimeout(() => {
                if (div.parentNode) div.parentNode.removeChild(div);
            }, 300); // 等待淡出动画结束
        }

        function showError(msg, color) {
            let list = document.getElementById("error-list");
            let div = document.createElement("div");
            div.className = `toast-enter glass px-6 py-3 rounded-xl shadow-2xl font-medium text-sm flex items-center border ${color === "green"
                ? "bg-emerald-500/10 border-emerald-500/30 text-emerald-400"
                : "bg-red-500/10 border-red-500/30 text-red-400"
                }`;
            div.innerHTML = msg;
            list.appendChild(div);
            setTimeout(() => removeError(div), 3000);
        }

        class limit {
            constructor() {
                this.flag = false;
                this.score = -1;
                this.level = "";
            }
        }
        let lim = [];
        for (let i = 0; i < contests.length; ++i) lim.push(new limit());

        function updateContestList() {
            let list = document.getElementById("contest-list");
            list.innerHTML = "";
            let hasItems = false;
            for (let i = 0; i < contests.length; ++i) if (lim[i].flag) hasItems = true;

            if (!hasItems) {
                list.innerHTML = "<tr><td colspan='4' class='text-center text-gray-500 py-10 text-sm font-medium'>暂未选择任何比赛条件</td></tr>";
                return;
            }

            let header = document.createElement("tr");
            header.className = "bg-white/5 border-b border-gray-700/50 text-xs font-bold text-gray-400 uppercase tracking-wider";
            header.innerHTML = `
                <th class="p-4 w-[40%] font-medium">比赛名称</th>
                <th class="p-4 w-[20%] font-medium text-center">得分限制</th>
                <th class="p-4 w-[20%] font-medium text-center">奖项限制</th>
                <th class="p-4 w-[20%] font-medium text-center">操作</th>
            `;
            list.appendChild(header);

            for (let i = 0; i < contests.length; ++i) {
                if (lim[i].flag) {
                    let item = document.createElement("tr");
                    item.className = "border-b border-gray-800/50 hover:bg-white/5 transition-colors";

                    let name = document.createElement("td");
                    name.className = "p-4 text-gray-200 font-semibold";
                    name.innerHTML = `${contests[i]}`;

                    let score = document.createElement("td");
                    score.id = `score${i}`;
                    score.className = "p-4 text-center";
                    let scoreDiv = document.createElement("div");
                    scoreDiv.className = "inline-block text-blue-400 hover:text-blue-300 cursor-pointer border-b border-dashed border-blue-500/50 pb-0.5 transition-colors font-medium";
                    scoreDiv.innerHTML = lim[i].score == -1 ? "不限" : lim[i].score;
                    scoreDiv.onclick = () => { inputScore_start(i); };
                    score.appendChild(scoreDiv);

                    let level = document.createElement("td");
                    level.id = `level${i}`;
                    level.className = "p-4 text-center";
                    let levelDiv = document.createElement("div");
                    levelDiv.className = "inline-block text-blue-400 hover:text-blue-300 cursor-pointer border-b border-dashed border-blue-500/50 pb-0.5 transition-colors font-medium";
                    levelDiv.innerHTML = lim[i].level == "" ? "不限" : lim[i].level;
                    levelDiv.onclick = () => { inputLevel_start(i); };
                    level.appendChild(levelDiv);

                    let removeButtonContainer = document.createElement("td");
                    removeButtonContainer.className = "p-4 text-center";
                    removeButtonContainer.innerHTML = `<button class="px-3 py-1.5 bg-red-500/10 border border-red-500/20 text-red-400 hover:bg-red-500/20 hover:text-red-300 rounded-md text-xs font-semibold transition-all shadow-sm" onclick="removeContest(${i})">移除</button>`;

                    item.appendChild(name);
                    item.appendChild(score);
                    item.appendChild(level);
                    item.appendChild(removeButtonContainer);
                    list.appendChild(item);
                }
            }
        }
        updateContestList();

        function removeContest(id) {
            lim[id].flag = false;
            updateContestList();
        }

        function addContest(id) {
            if (lim[id].flag)
                showError("该比赛已经添加到列表中了", "red");
            else
                lim[id].flag = true;
            updateContestList();
        }

        function inputScore_start(id) {
            let element = document.getElementById(`score${id}`);
            let input = document.createElement("input");
            input.type = "number";
            input.value = lim[id].score == -1 ? "" : lim[id].score;
            input.className = "bg-[#0d1117] border border-blue-500/50 text-white px-3 py-1 rounded-md w-20 text-center outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400 text-sm shadow-inner transition-all";
            input.onblur = () => {
                let val = input.value === "" ? -1 : (Number)(input.value);
                inputScore_end(id, val);
            };
            input.onkeydown = (e) => { if (e.key === 'Enter') input.blur(); };
            element.innerHTML = "";
            element.appendChild(input);
            input.focus();
        }

        function inputScore_end(id, score) {
            lim[id].score = score;
            updateContestList();
        }

        function inputLevel_start(id) {
            let element = document.getElementById(`level${id}`);
            let select = document.createElement("select");
            select.className = "bg-[#0d1117] border border-blue-500/50 text-white px-2 py-1 rounded-md outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400 text-sm shadow-inner transition-all cursor-pointer";
            const options = ["不限", "金牌", "银牌", "铜牌", "一等奖", "二等奖", "三等奖"];
            options.forEach(opt => {
                let o = document.createElement("option");
                o.value = opt === "不限" ? "" : opt;
                o.innerHTML = opt;
                o.className = "bg-[#0d1117] text-gray-200";
                select.appendChild(o);
            });
            element.innerHTML = "";
            element.appendChild(select);
            select.onblur = () => { inputLevel_end(id, select.value); };
            select.onchange = () => { select.blur(); };
            select.value = lim[id].level;
            select.focus();
        }

        function inputLevel_end(id, level) {
            lim[id].level = level;
            updateContestList();
        }

        function searchContest() {
            const inputVal = document.getElementById("contest-input").value.trim().toUpperCase();
            let list = document.getElementById("search-result");

            if (!inputVal) {
                list.innerHTML = "";
                return;
            }
            let result = [];
            for (let i = 0; i < contests.length; ++i)
                result.push({ name: contests[i], id: i });

            result.sort((a, b) => levenshtein(a.name, inputVal) - levenshtein(b.name, inputVal));

            list.innerHTML = "";
            for (let i = 0; i < Math.min(10, result.length); ++i) {
                let item = document.createElement("li");
                item.className = "flex justify-between items-center p-3 hover:bg-white/5 transition-colors text-gray-300 text-sm";
                item.innerHTML = `<span class="font-medium">${result[i].name}</span>`;

                let button = document.createElement("button");
                button.className = "px-3 py-1.5 bg-blue-500/10 border border-blue-500/20 text-blue-400 hover:bg-blue-500/20 hover:text-blue-300 rounded-md text-xs font-semibold transition-all shadow-sm";
                button.innerHTML = "添加";
                button.onclick = () => {
                    addContest(result[i].id);
                    // 可选：添加完后清空搜索框
                    // document.getElementById("contest-input").value = "";
                    // list.innerHTML = "";
                };
                item.appendChild(button);
                list.appendChild(item);
            }
        }

        function generate() {
            let information = [];
            for (let i = 0; i < lim.length; ++i)
                if (lim[i].flag)
                    information.push({ id: i, score: lim[i].score, level: lim[i].level });

            if (information.length === 0) {
                showError("请至少选择一个比赛条件", "red");
                return;
            }

            document.getElementById("code").innerText = `/** @param {OIerDb} db */
export default (db) => {
    return db.oiers.filter((oier) => {
        const information = JSON.parse(\`${JSON.stringify(information)}\`);
        let res = true;
        for (let each of information) {
            let exist = false;
            for (let record of oier.records) {
                if (record.contest.id === each.id) {
                    const scoreMatch = (each.score === -1 || record.score === each.score);
                    const levelMatch = (each.level === "" || record.level === each.level);
                    if (scoreMatch && levelMatch) exist = true;
                }
            }
            if (!exist) res = false;
        }
        return res;
    }).sort((a, b) => a.records.length - b.records.length);
};`;
        }

        async function copyCode() {
            const codeText = document.getElementById("code").innerText;
            if (codeText.startsWith("//")) {
                showError("请先生成代码", "red");
                return;
            }
            try {
                await navigator.clipboard.writeText(codeText);
                showError("代码已复制到剪贴板", "green");
            } catch (e) {
                showError(`复制失败: ${e}`, "red");
            }
        }

        function openOierDB() {
            window.open(`https://oier.baoshuo.dev/custom-search`);
        }
    </script>
</body>

</html>
